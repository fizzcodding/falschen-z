<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- LifeSphere mark: nested orbit rings around a solid core, anvil-accented -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#101A2E" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#101A2E" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#101A2E" stroke-width="2"/>
  <circle cx="32" cy="32" r="8" fill="#101A2E"/>
  <circle cx="32" cy="32" r="3" fill="#8BFF6A"/>
  <!-- Orbit ticks -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#101A2E" stroke-width="2.5"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="#101A2E" stroke-width="2.5"/>
  <line x1="4" y1="32" x2="10" y2="32" stroke="#101A2E" stroke-width="2.5"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#101A2E" stroke-width="2.5"/>
  <!-- Diagonal orbit node -->
  <circle cx="50" cy="14" r="4" fill="#8BFF6A" stroke="#101A2E" stroke-width="1.5"/>
</svg>
